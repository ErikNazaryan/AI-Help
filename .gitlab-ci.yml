stages:
  - build
  - scan
  - deploy

# 🔗 Ժառանգում ենք կաղապարները՝ ֆիքսված v1.0.0 թեգով (PIN the version)
include:
  - project: 'ErikNazaryan/ci-templates'
    ref: v1.0.0
    file: '/templates/build.yml'
  - project: 'ErikNazaryan/ci-templates'
    ref: v1.0.0
    file: '/templates/security.yml'
  - project: 'ErikNazaryan/ci-templates'
    ref: v1.0.0
    file: '/templates/deploy.yml'

# 🛠️ Ակտիվացնում ենք ջոբերը առանց սկրիպտներ կրկնելու (DRY Refactor)
build-image:
  extends: .docker-build
  tags:
    - self-hosted
  variables:
    IMAGE: "docker.io/eriknazaryan/genesis"

trivy-scan-image:
  extends: .trivy-scan
  tags:
    - self-hosted
  variables:
    IMAGE: "docker.io/eriknazaryan/genesis"

deploy-app:
  extends: .helm-deploy
  tags:
    - self-hosted