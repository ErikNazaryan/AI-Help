stages:
  - build
  - scan
  - deploy

# 🔗 Ժառանգում ենք կաղապարները v1.0.0 թեգով
include:
  - project: 'ErikNazaryan/ci-templates'
    ref: v1.0.0
    file: '/templates/build.yml'
  - project: 'ErikNazaryan/ci-templates'
    ref: v1.0.0
    file: '/templates/security.yml'

variables:
  IMAGE: "docker.io/eriknazaryan/genesis"

# 🛠️ 1. Build Փուլ
build-image:
  stage: build
  extends: .docker-build
  tags:
    - self-hosted

# 🛡️ 2. Scan Փուլ (Trivy Security Gate)
container-scan:
  extends: .trivy-scan
  stage: scan
  tags:
    - self-hosted
  allow_failure: false

# 🚀 3. Deploy Փուլ (GitOps Loop: Bump Chart & Commit Back)
bump-chart:
  stage: deploy
  tags:
    - self-hosted
  script:
    - echo "Updating Helm Chart with the new image tag..."
    
    # 📝 1. sed-ով փոխում ենք tag-ի արժեքը values.yaml ֆայլում
    - sed -i '' "s/tag:.*/tag:\ \"$CI_COMMIT_SHORT_SHA\"/g" genesis-chart/values.yaml
    
    # ⚙️ 2. Կոնֆիգուրացնում ենք ժամանակավոր Git user, որ ռանները կարողանա commit անել
    - git config user.name "Genesis CI Bot"
    - git config user.email "ci-bot@genesis.com"
    
    # 📦 3. Commit ենք անում փոփոխված values.yaml-ը և push անում հետ ռեպո
    - git add genesis-chart/values.yaml
    - git commit -m "ci:\ genesis:$CI_COMMIT_SHORT_SHA [skip ci]"
    - git push origin HEAD:$CI_COMMIT_REF_NAME