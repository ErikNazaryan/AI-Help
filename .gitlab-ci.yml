stages:
  - build
  - scan
  - deploy

# 🔗 Ժառանգում ենք կաղապարները v1.0.0 թեգով
include:
  - project: 'ErikNazaryan/ci-templates'
    ref: v1.0.0
    file: '/templates/build.yml'
  - project: 'ErikNazaryan/ci-templates'
    ref: v1.0.0
    file: '/templates/security.yml'
  - project: 'ErikNazaryan/ci-templates'
    ref: v1.0.0
    file: '/templates/deploy.yml'

# 🛠️ 1. Build Փուլ
build-image:
  stage: build
  extends: .docker-build
  tags:
    - self-hosted
  variables:
    IMAGE: "docker.io/eriknazaryan/genesis"

# 🛡️ 2. Scan Փուլ (Իրական Անվտանգության Պատնեշ)
container-scan:
  extends: .trivy-scan
  stage: scan
  tags:
    - self-hosted
  variables:
    IMAGE: "docker.io/eriknazaryan/genesis"
  allow_failure: false               # 🛑 Իրական պատնեշ. բլոկում է փայփլայնը սխալների դեպքում

# 🚀 3. Deploy Փուլ
deploy-app:
  stage: deploy
  extends: .helm-deploy
  tags:
    - self-hosted