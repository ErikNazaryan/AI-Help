apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genesis-gitops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ErikNazaryan/AI-Help.git
    targetRevision: gitops-release # 🎯 Քո մաքուր branch-ը
    path: genesis-chart # 📂 Քո chart-ի թղթապանակը
  destination:
    server: https://kubernetes.default.svc
    namespace: default # 🐳 Քո օգտագործած namespace-ը
  syncPolicy:
    automated:
      prune: true
      selfHeal: true