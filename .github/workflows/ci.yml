name: Project Genesis Modular Pipeline

on:
  push:
    branches:
      - main
      - gitops-release

jobs:
  delivery:
    # 🔗 Ճշգրիտ GitHub Actions սինտաքսը՝ Reusable Workflow կանչելու համար
    uses: ErikNazaryan/ci-templates/.github/workflows/shared-pipeline.yml@v1
    with:
      image: docker.io/eriknazaryan/genesis:${{ github.sha }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.DOCKER_PASSWORD }}