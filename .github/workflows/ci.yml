name: Genesis Multi-Stage Pipeline
on:
  push:
    branches: [main, hw31]

jobs:
  test-stage:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Code Verification
      run: |
        echo "=== STAGE 1: TESTING STARTED ==="
        docker --version
        kubectl version --client
        helm version
        echo "All local architecture tools are verified and ready!"

  build-stage:
    runs-on: self-hosted
    needs: test-stage
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/genesis:${{ github.sha }} .

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/genesis:${{ github.sha }}
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/genesis:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/genesis:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/genesis:latest

  deploy-stage:
    runs-on: self-hosted
    needs: build-stage
    steps:
    - name: Deploy Announcement
      run: |
        echo "=== STAGE 3: DEPLOYMENT STARTED ==="
        echo "Ready to upgrade Helm chart in the next phase!"
        