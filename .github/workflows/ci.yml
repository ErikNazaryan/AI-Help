name: Project Genesis Modular Pipeline

on:
  push:
    branches:
      - main
      - gitops-release

jobs:
  delivery:
  
    uses: ErikNazaryan/ci-templates/.github/workflows/shared-pipeline.yml@main
    with:
      image: docker.io/eriknazaryan/genesis:${{ github.sha }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.DOCKER_PASSWORD }}