name: Genesis Multi-Stage Pipeline
on:
  push:
    branches: [main, hw31]

jobs:
  # ----------------------------------------
  # STAGE 1: TEST STATION
  # ----------------------------------------
  test-stage:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 🧪 RUN TESTS: Օգտագործում ենք քո Mac-ի պատրաստի Python-ը
    - name: Run Test Suite
      run: |
        echo "=== STAGE 1: TESTING STARTED ==="
        python3 -m pip install --user pytest
        if [ ! -f test_app.py ]; then
          echo 'def test_trivial(): assert 1 + 1 == 2' > test_app.py
        fi
        python3 -m pytest -q