version: '3.8'
services:
  app:
    build: .
    networks:
      - genesis-net
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: genesis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - genesis-net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - genesis-net

networks:
  genesis-net:
    driver: bridge

volumes:
  postgres_data: